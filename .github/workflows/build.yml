
name: Build Glass Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          unzip -q GlassCenterLiquid_v02_Source.zip -d project
          ls -la project/GlassCenterLiquid_v02

      - name: Fix Java compilation error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "project/GlassCenterLiquid_v02/app/src/main/java/dev/local/glasscenter/GlassSlider.java"
          )

          code = p.read_text()

          old = "c.clipRoundRect(0,0,w,h,r,r);"

          new = """
          android.graphics.Path clip = new android.graphics.Path();
          clip.addRoundRect(
              0, 0, w, h, r, r,
              android.graphics.Path.Direction.CW
          );
          c.clipPath(clip);
          """

          code = code.replace(old, new)
          p.write_text(code)
          print("Java patch applied")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/GlassCenterLiquid_v02
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassCenterLiquid-Debug-APK
          path: project/GlassCenterLiquid_v02/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
